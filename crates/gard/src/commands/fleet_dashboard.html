<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="300">
<title>Gard Fleet</title>
<style>
/* Layout: summary tiles over a member table; state carried by pills, not color alone */
:root {
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --good-wash: rgba(12, 163, 12, 0.10);
  --warning-wash: rgba(250, 178, 25, 0.14);
  --serious-wash: rgba(236, 131, 90, 0.14);
  --critical-wash: rgba(208, 59, 59, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --border: rgba(255, 255, 255, 0.10);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-block: 24px;
  padding-inline: max(16px, 4vw);
}
main { max-width: 1080px; margin-inline: auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
h1 small { font-weight: 500; color: var(--muted); font-size: 13px; }
.meta { color: var(--ink-2); font-size: 13px; margin-left: auto; }
.banner {
  border: 1px solid var(--border);
  border-left: 4px solid var(--good);
  background: var(--good-wash);
  border-radius: 6px;
  padding: 10px 14px;
  font-weight: 600;
}
.banner.bad { border-left-color: var(--critical); background: var(--critical-wash); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}
.tile .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.tile .value { font-size: 28px; font-weight: 650; line-height: 1.2; }
.tile .sub { color: var(--ink-2); font-size: 12px; }
.tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--grid);
}
td { padding: 10px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr.member-row td { border-bottom: none; }
tr.detail-row td { padding-top: 0; }
tbody tr:last-child td { border-bottom: none; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }
.host, .keyid { color: var(--ink-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 999px; padding: 2px 10px 2px 8px;
  font-size: 12px; font-weight: 650; white-space: nowrap;
}
.pill.pass { color: var(--good); background: var(--good-wash); }
.pill.stale { color: var(--warning); background: var(--warning-wash); }
.pill.fail { color: var(--critical); background: var(--critical-wash); }
.pill.badsig { color: var(--critical); background: var(--critical-wash); }
:root[data-theme="dark"] .pill.stale, :root:not([data-theme="light"]) .pill.stale { color: var(--warning); }
.detail { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.detail .warn { color: var(--serious); font-weight: 600; }
.detail .alarm { color: var(--critical); font-weight: 600; }
.detail .ok { color: var(--good); }
.empty { padding: 32px; text-align: center; color: var(--ink-2); }
.empty code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
button.theme {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 6px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
}
button.theme:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 1px; }
@media (max-width: 480px) { .tile .value { font-size: 22px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gard Fleet <small id="fleet-label"></small></h1>
    <span class="meta" id="generated"></span>
    <button class="theme" id="themebtn" type="button">Theme</button>
  </header>
  <div class="banner" id="banner"></div>
  <section class="tiles" id="tiles"></section>
  <section class="tablewrap">
    <table aria-describedby="generated">
      <thead>
        <tr>
          <th>Member</th><th>Host</th><th class="num">Age</th><th>Signature</th>
          <th class="num">Crit</th><th class="num">High</th><th class="num">Findings</th>
          <th>Trusted</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <footer>
    <span>Generated by <code>gard fleet dashboard</code> — regenerated on every <code>gard fleet submit</code>.</span>
    <span>Stale threshold: <span id="stale-th"></span>h. Page auto-reloads every 5 minutes.</span>
  </footer>
</main>
<script>
const DATA = __GARD_DATA__;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function memberState(m) {
  if (!m.signature_valid) return { cls: "badsig", icon: "✕", label: "BAD SIG" };
  if (m.stale) return { cls: "stale", icon: "◷", label: "STALE" };
  if (!m.preflight_passing) return { cls: "fail", icon: "✕", label: "FAIL" };
  return { cls: "pass", icon: "✓", label: "PASS" };
}

function render() {
  const members = DATA.members || [];
  document.getElementById("fleet-label").textContent = DATA.fleet_label || "";
  document.getElementById("generated").textContent =
    "Generated " + new Date(DATA.generated_at).toLocaleString();
  document.getElementById("stale-th").textContent = DATA.max_age_hours;

  const passing = members.filter((m) => memberState(m).label === "PASS").length;
  const blocking = members.reduce((n, m) => n + (m.preflight_passing ? 0 : 1), 0);
  const stale = members.filter((m) => m.stale).length;
  const badsig = members.filter((m) => !m.signature_valid).length;
  const expiring = members.reduce(
    (n, m) => n + (m.suppressions || []).filter((s) => s.expiring_soon && s.days_left >= 0).length, 0);

  const banner = document.getElementById("banner");
  if (DATA.all_green) {
    banner.textContent = "✓ Fleet green — all members passing and fresh.";
  } else {
    banner.classList.add("bad");
    banner.textContent = "✕ Fleet not green — review the members below.";
  }

  const tiles = [
    { label: "Members", value: members.length, sub: passing + " passing" },
    { label: "Failing preflight", value: blocking, sub: badsig ? badsig + " bad signature" : "signatures all valid" },
    { label: "Stale reports", value: stale, sub: "older than " + DATA.max_age_hours + "h" },
    { label: "Suppressions expiring", value: expiring, sub: "within 7 days" },
  ];
  document.getElementById("tiles").innerHTML = tiles.map((t) =>
    '<div class="tile"><div class="label">' + esc(t.label) + '</div>' +
    '<div class="value">' + esc(t.value) + '</div>' +
    '<div class="sub">' + esc(t.sub) + "</div></div>").join("");

  const rows = document.getElementById("rows");
  if (!members.length) {
    rows.innerHTML = '<tr><td colspan="9"><div class="empty">No reports yet. ' +
      "Members submit with <code>gard fleet submit</code>.</div></td></tr>";
    return;
  }
  rows.innerHTML = members.map((m) => {
    const st = memberState(m);
    const details = [];
    for (const s of m.suppressions || []) {
      if (s.days_left < 0) continue;
      const line = "suppression ‘" + esc(s.check_id) + "’ expires in " +
        s.days_left + " day(s) — " + esc(s.reason);
      details.push('<span class="' + (s.expiring_soon ? "warn" : "") + '">' +
        (s.expiring_soon ? "⚠ " : "· ") + line + "</span>");
    }
    if ((m.new_check_ids || []).length)
      details.push('<span class="alarm">✕ new since previous report: ' +
        esc(m.new_check_ids.join(", ")) + "</span>");
    if ((m.resolved_check_ids || []).length)
      details.push('<span class="ok">✓ resolved since previous report: ' +
        esc(m.resolved_check_ids.join(", ")) + "</span>");

    const row =
      '<tr class="member-row"><td><strong>' + esc(m.member) + "</strong></td>" +
      '<td class="host">' + esc(m.hostname) + "</td>" +
      '<td class="num">' + esc(m.age_hours) + "h</td>" +
      "<td>" + (m.signature_valid ? "valid" : '<span class="alarm">INVALID</span>') + "</td>" +
      '<td class="num">' + esc(m.critical) + "</td>" +
      '<td class="num">' + esc(m.high) + "</td>" +
      '<td class="num">' + esc(m.total_findings) + "</td>" +
      "<td>" + (m.trusted ? esc(m.trusted) : '<span class="host">—</span>') + "</td>" +
      '<td><span class="pill ' + st.cls + '">' + st.icon + " " + st.label + "</span></td></tr>";
    const detailRow = details.length
      ? '<tr class="detail-row"><td colspan="9"><div class="detail">' + details.join("") + "</div></td></tr>"
      : "";
    return row + detailRow;
  }).join("");
}

document.getElementById("themebtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("gard-theme", dark ? "light" : "dark"); } catch (e) {}
});
try {
  const saved = localStorage.getItem("gard-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}

render();
</script>
</body>
</html>
