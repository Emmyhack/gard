[workspace]
members = ["crates/gard"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Gard Contributors"]
license = "MIT"
repository = "https://github.com/Emmyhack/gard"
description = "OPSEC guardian CLI tool for Solana protocol teams"

[workspace.dependencies]
# CLI argument parsing - well-maintained, widely used in production Rust CLIs
clap = { version = "4.4", features = ["derive", "cargo"] }

# Async runtime - Tokio is standard for async I/O in security tools
tokio = { version = "1.35", features = ["full"] }

# JSON serialization - serde is essential for machine-readable output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TOML configuration parsing
toml = "0.8"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography for report signing (Ed25519)
ed25519-dalek = "2.1"
hex = "0.4"

# Structured error types
thiserror = "1.0"

# System information and process management
sysinfo = "0.30"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Network utilities for RPC calls
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Regex for pattern matching
regex = "1.10"

# Terminal UI and colors
colored = "2.1"

# Home directory detection
dirs = "5.0"

# Random number generation for key generation
rand = "0.8"

# Secure memory handling for cryptographic keys
zeroize = { version = "1.7", features = ["derive"] }
